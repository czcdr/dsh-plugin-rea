# 投稿条目：awesome-dsh-plugin
#
# 用途：向 https://github.com/awesome-dsh-plugin/awesome-dsh-plugin 提交 PR 时，
#       把下面的内容保存为 data/plugins/czcdr__dsh-plugin-rea.yml（一个文件即全部投稿）。
# 规则要点（见该仓库 contributing.md）：
#   - 仓库需声明 dsh.bundle（本仓库已声明）；
#   - 仓库创建需满 1 天；
#   - 仓库需带 dsh-plugin topic；
#   - 描述必须属实，且不含营销词；
#   - 一个 PR 最多 3 条。
#
# 若已发布 Release tarball，可取消下面 tarball 行的注释（资产名必须不带版本号）。
# 本仓库已在 v1.0.0 Release 中附带 dsh-plugin-rea.tgz，故该行已启用。

url: https://github.com/czcdr/dsh-plugin-rea
name: czcdr/dsh-plugin-rea
category: tools
description:
  en: 'Third-party adapter that registers the upstream REA (Reverse Engineer Anything) MCP server into DeepSeek Harness as mcp__rea__* tools. REA itself analyses native binaries (Hopper/Ghidra/IDA), JavaScript/Electron apps, .NET assemblies, websites, Android APKs and adb devices, firmware, and process captures.'
  zh: '第三方适配插件：把上游 REA（逆向一切，github.com/morluto/rea）的 MCP 服务注册进 DeepSeek Harness，提供 mcp__rea__* 工具。逆向分析能力由 REA 提供，覆盖原生二进制（Hopper/Ghidra/IDA）、JavaScript/Electron 应用、.NET 程序集、网站、Android APK 与 adb 设备、固件与进程捕获。'
tarball: https://github.com/czcdr/dsh-plugin-rea/releases/latest/download/dsh-plugin-rea.tgz
