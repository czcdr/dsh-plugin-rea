# dsh-plugin-rea — REA (Reverse Engineer Anything) as native DSH tools
#
# Configuration-only bundle: no Host/Client entry files. It inserts one row of
# the official MCP client plugin and points it at the installed `rea mcp`
# stdio server; the model then sees mcp__rea__<tool>.
#
# ---------------------------------------------------------------------------
# PORTABLE BY DEFAULT — this file carries no machine-specific path.
#
#   Prerequisite: `rea` must be reachable from the PATH the harness sees.
#                 (`npm i -g rea-agents` puts it there.)
#
#   Windows    : command: cmd.exe   args: ['/c', 'rea', 'mcp']   (as below)
#   macOS/Linux: command: 'rea'     args: ['mcp']
#                → see examples/cordis.patch.posix.yml
#
#   Analysis engines: REA reads GHIDRA_INSTALL_DIR from its environment.
#     - Option 1 (recommended): set it as an OS-level environment variable,
#       then start/restart the harness so the MCP child inherits it.
#     - Option 2: put an `env:` block in the row —
#       see examples/cordis.patch.with-env.yml.
#     Without it, native analysis reports the engine as unavailable while every
#     other REA capability keeps working. Static JavaScript/Electron and .NET
#     analysis need no engine at all.
#
#   Only ONE row may use serverName: rea in a profile. To adapt this bundle for
#   your machine without touching the upstream file, override `mcp-rea` from
#   your profile's own cordis.patch.yml (id-targeted config override) — that
#   file is never published.
# ---------------------------------------------------------------------------

- insert:
    - id: mcp-rea
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        command: 'cmd.exe'
        args:
          - '/c'
          - 'rea'
          - 'mcp'
        failOnStartupError: false
